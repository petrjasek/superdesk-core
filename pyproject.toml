[tool.black]
line-length = 120
target-version = ['py310']
include = '\.py$'
exclude = '''
(
    \.eggs
    | \.git
    | \.mypy_cache
    | \.tox
    | \.env
    | _build
    | build
    | dist
    | env
    | src
)
'''

[tool.pytest.ini_options]
testpaths = ["tests", "superdesk", "apps", "content_api"]
python_files = "*_test.py *_tests.py test_*.py tests_*.py tests.py test.py"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
src = ["superdesk", "apps", "tests"]
exclude = ["docs/", "dist/"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
]
ignore = [
    "E501",   # line too long
]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"